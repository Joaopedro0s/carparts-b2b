# Nginx na frente do Jenkins: HTTPS e controle de origem.
# A 8080 do Jenkins só escuta em 127.0.0.1; tudo passa por aqui.

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jenkins.carparts.local;

    ssl_certificate     /etc/nginx/certs/jenkins.crt;
    ssl_certificate_key /etc/nginx/certs/jenkins.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Webhook do GitHub: único caminho acessível de fora da LAN, e só dos IPs
    # de hooks do GitHub (lista em https://api.github.com/meta, chave "hooks").
    # O payload ainda é validado pelo segredo HMAC configurado no Jenkins.
    location = /github-webhook/ {
        allow 192.30.252.0/22;
        allow 185.199.108.0/22;
        allow 140.82.112.0/20;
        allow 143.55.64.0/20;
        allow 2a0a:a440::/29;
        allow 2606:50c0::/32;
        deny  all;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Interface web, API e agents por WebSocket: somente rede interna/VPN.
    location / {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
}
